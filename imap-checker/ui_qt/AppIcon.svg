<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3F1"/>
      <stop offset="1" stop-color="#C9E4FF"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF4E0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#7A5AA8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- sparkles & hearts -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M170 210 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z"/>
    <path d="M860 170 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z"/>
    <path d="M150 760 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z"/>
  </g>
  <path d="M842 330 c0 -22 30 -30 40 -10 c10 -20 40 -12 40 10 c0 26 -40 46 -40 46 s-40 -20 -40 -46z" fill="#FF8FB8"/>
  <path d="M110 470 c0 -16 22 -22 29 -7 c7 -15 29 -9 29 7 c0 19 -29 34 -29 34 s-29 -15 -29 -34z" fill="#FFB3CF"/>

  <!-- shadow on ground -->
  <ellipse cx="512" cy="872" rx="250" ry="34" fill="#7A5AA8" opacity="0.15"/>

  <!-- little feet -->
  <ellipse cx="420" cy="846" rx="62" ry="36" fill="#FF9EC4" stroke="#5B3A6E" stroke-width="14"/>
  <ellipse cx="604" cy="846" rx="62" ry="36" fill="#FF9EC4" stroke="#5B3A6E" stroke-width="14"/>

  <!-- left arm waving -->
  <path d="M240 560 C170 520 150 460 176 420" fill="none" stroke="#5B3A6E" stroke-width="44" stroke-linecap="round"/>
  <path d="M240 560 C170 520 150 460 176 420" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <circle cx="172" cy="404" r="36" fill="#FFFFFF" stroke="#5B3A6E" stroke-width="14"/>

  <!-- body envelope -->
  <g filter="url(#sh)">
    <rect x="232" y="380" width="560" height="450" rx="110" fill="url(#env)" stroke="#5B3A6E" stroke-width="16"/>
  </g>
  <!-- envelope flap -->
  <path d="M262 420 Q512 640 762 420" fill="none" stroke="#FFB3CF" stroke-width="26" stroke-linecap="round"/>
  <!-- heart seal -->
  <path d="M488 560 c0 -18 24 -24 32 -8 c8 -16 32 -10 32 8 c0 22 -32 38 -32 38 s-32 -16 -32 -38z" transform="translate(-8 0)" fill="#FF6FA5"/>

  <!-- eyes -->
  <g>
    <ellipse cx="400" cy="660" rx="40" ry="50" fill="#3A2350"/>
    <circle cx="414" cy="642" r="16" fill="#FFFFFF"/>
    <circle cx="390" cy="680" r="7" fill="#FFFFFF"/>
    <ellipse cx="624" cy="660" rx="40" ry="50" fill="#3A2350"/>
    <circle cx="638" cy="642" r="16" fill="#FFFFFF"/>
    <circle cx="614" cy="680" r="7" fill="#FFFFFF"/>
  </g>
  <!-- blush -->
  <ellipse cx="338" cy="728" rx="42" ry="22" fill="#FF8FB8" opacity="0.6"/>
  <ellipse cx="686" cy="728" rx="42" ry="22" fill="#FF8FB8" opacity="0.6"/>
  <!-- mouth -->
  <path d="M482 720 Q497 744 512 722 Q527 744 542 720" fill="none" stroke="#3A2350" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right arm holding check badge -->
  <path d="M784 580 C850 540 868 480 846 430" fill="none" stroke="#5B3A6E" stroke-width="44" stroke-linecap="round"/>
  <path d="M784 580 C850 540 868 480 846 430" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <g filter="url(#sh)">
    <circle cx="820" cy="330" r="112" fill="#4ADE80" stroke="#5B3A6E" stroke-width="16"/>
  </g>
  <path d="M768 332 L804 368 L872 296" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tiny antenna/sprout on head -->
  <path d="M512 380 C512 330 520 300 540 280" fill="none" stroke="#5B3A6E" stroke-width="14" stroke-linecap="round"/>
  <path d="M540 280 C580 250 620 270 610 300 C590 320 555 305 540 280z" fill="#7EE0A1" stroke="#5B3A6E" stroke-width="12" stroke-linejoin="round"/>
</svg>
